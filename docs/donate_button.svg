<svg xmlns="http://www.w3.org/2000/svg" width="300" height="72" viewBox="0 0 300 72" role="img" aria-labelledby="title">
  <!-- The README's Donate button. GitHub strips CSS from Markdown, so the
       button is an image; this SVG animates itself. Same blue and heart as
       the plugin's About-tab button (kicad_routing_plugin/about_tab.py). -->
  <title id="title">Donate to KiCadRoutingTools</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b8ad6"/>
      <stop offset="1" stop-color="#0070ba"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill">
      <rect x="2" y="2" width="296" height="64" rx="32"/>
    </clipPath>
  </defs>
  <style>
    .shine { animation: sweep 3.6s ease-in-out infinite; }
    @keyframes sweep {
      0%        { transform: translateX(-110px); }
      38%, 100% { transform: translateX(360px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .shine { animation: none; transform: translateX(-110px); }
    }
    text { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect x="2" y="6" width="296" height="64" rx="32" fill="#004f85"/>
  <rect x="2" y="2" width="296" height="64" rx="32" fill="url(#face)"/>
  <rect x="3" y="3" width="294" height="62" rx="31" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <g clip-path="url(#pill)">
    <g class="shine">
      <rect x="0" y="-20" width="84" height="110" fill="url(#shine)" transform="skewX(-22)"/>
    </g>
  </g>
  <path transform="translate(82 19) scale(1.3)" fill="#ffffff"
        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  <text x="126" y="44" fill="#ffffff">Donate</text>
</svg>
